services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: pyxl-test:latest
    volumes:
      - .:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
    working_dir: /workspace
    command: pytest tests/ -v

volumes:
  cargo-cache:
  target-cache:
